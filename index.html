<!doctype html><html lang="tr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#f7f7f2"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><meta name="apple-mobile-web-app-title" content="Ev Listesi"/><link rel="apple-touch-icon" href="/icons/icon-192.png"/><title>Ev Alışveriş Listesi</title></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script><script src="/market-widget.js"></script><script>const addResetLink=()=>{const card=document.querySelector('.auth-card');if(!card||card.querySelector('.forgot-password-link'))return;const links=[...card.querySelectorAll('button.link')];const loginLink=links.find(x=>x.textContent.includes('İlk kez kullanıyorum'));if(!loginLink)return;const a=document.createElement('a');a.href='/reset-password.html';a.textContent='Şifremi unuttum';a.className='link forgot-password-link';a.style.cssText='display:block;text-align:center;text-decoration:none;margin-top:8px;';loginLink.insertAdjacentElement('afterend',a)};new MutationObserver(addResetLink).observe(document.getElementById('root'),{childList:true,subtree:true});addResetLink();</script></body></html>
