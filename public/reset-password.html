<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7f2" />
  <title>Şifre Yenile · Ev Listesi</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f7f7f2;color:#101828;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(430px,100%);background:#fff;border:1px solid #e7e9ed;border-radius:28px;padding:30px 24px;box-shadow:0 18px 50px rgba(16,24,40,.08)}.logo{width:54px;height:54px;border-radius:17px;background:#14213d;color:#fff;display:grid;place-items:center;font-size:25px;margin-bottom:20px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;color:#687386}.card h1{font-size:31px;line-height:1.05;margin:8px 0 10px}.card p{color:#667085;line-height:1.5;margin:0 0 22px}.field{width:100%;height:54px;border:1px solid #d9dde5;border-radius:15px;padding:0 15px;font-size:16px;outline:none;margin-bottom:12px}.field:focus{border-color:#14213d;box-shadow:0 0 0 3px rgba(20,33,61,.08)}button{width:100%;height:54px;border:0;border-radius:15px;background:#14213d;color:#fff;font-size:16px;font-weight:800;cursor:pointer}.secondary{background:#eef1f5;color:#14213d;margin-top:10px}.msg{margin-top:14px;padding:12px 14px;border-radius:13px;background:#f0f4f8;color:#344054;font-size:14px;line-height:1.4}.success{background:#edf8f0;color:#176b36}.hidden{display:none}.back{display:block;text-align:center;margin-top:18px;color:#667085;text-decoration:none;font-size:14px}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">🛒</div>
    <div class="eyebrow">EVİNİZİN LİSTESİ</div>
    <h1 id="title">Şifreni yenile</h1>
    <p id="desc">Hesabına kayıtlı e-posta adresini yaz. Sana güvenli bir şifre yenileme bağlantısı gönderelim.</p>

    <section id="request-view">
      <input id="email" class="field" type="email" autocomplete="email" placeholder="E-posta" />
      <button id="send">Şifre yenileme bağlantısı gönder</button>
    </section>

    <section id="update-view" class="hidden">
      <input id="password" class="field" type="password" autocomplete="new-password" placeholder="Yeni şifre" />
      <input id="password2" class="field" type="password" autocomplete="new-password" placeholder="Yeni şifre tekrar" />
      <button id="update">Şifreyi güncelle</button>
    </section>

    <div id="msg" class="msg hidden"></div>
    <a class="back" href="/">← Giriş ekranına dön</a>
  </main>

  <script>
    const requestView = document.getElementById('request-view')
    const updateView = document.getElementById('update-view')
    const msg = document.getElementById('msg')
    const title = document.getElementById('title')
    const desc = document.getElementById('desc')
    const showMsg = (text, success=false) => { msg.textContent=text; msg.className=`msg ${success?'success':''}` }

    const hash = new URLSearchParams(location.hash.replace(/^#/, ''))
    const accessToken = hash.get('access_token')
    const type = hash.get('type')

    if (accessToken && type === 'recovery') {
      requestView.classList.add('hidden')
      updateView.classList.remove('hidden')
      title.textContent = 'Yeni şifre oluştur'
      desc.textContent = 'Yeni şifreni iki kez gir. Güncelledikten sonra giriş ekranına dönebilirsin.'
    }

    document.getElementById('send').onclick = async () => {
      const email = document.getElementById('email').value.trim()
      if (!email) return showMsg('E-posta adresini gir.')
      const button = document.getElementById('send'); button.disabled = true; button.textContent = 'Gönderiliyor…'
      try {
        const r = await fetch('/api/password-reset', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'request',email}) })
        const data = await r.json().catch(()=>({}))
        if (!r.ok) throw new Error(data.error || 'Bağlantı gönderilemedi.')
        showMsg('Bağlantı gönderildi. E-posta kutunu ve spam klasörünü kontrol et.', true)
      } catch (e) { showMsg(e.message) }
      finally { button.disabled=false; button.textContent='Şifre yenileme bağlantısı gönder' }
    }

    document.getElementById('update').onclick = async () => {
      const password = document.getElementById('password').value
      const password2 = document.getElementById('password2').value
      if (password.length < 6) return showMsg('Yeni şifre en az 6 karakter olmalı.')
      if (password !== password2) return showMsg('Şifreler aynı değil.')
      const button = document.getElementById('update'); button.disabled=true; button.textContent='Güncelleniyor…'
      try {
        const r = await fetch('/api/password-reset', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'update',accessToken,password}) })
        const data = await r.json().catch(()=>({}))
        if (!r.ok) throw new Error(data.error || 'Şifre güncellenemedi.')
        showMsg('Şifren başarıyla güncellendi. Artık yeni şifrenle giriş yapabilirsin.', true)
        button.textContent='Güncellendi ✓'
        setTimeout(()=>location.href='/',1800)
      } catch (e) { showMsg(e.message); button.disabled=false; button.textContent='Şifreyi güncelle' }
    }
  </script>
</body>
</html>
